<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4efe5">
<meta name="description" content="Your life is a strip of paper. Tear the past, plan a day, and discover the time you can still choose. A simple English classroom game.">
<title>Paper Days — Your time, your choice</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css?v=2">
<link rel="stylesheet" href="./lab.css?v=2">
</head>
<body>
<header class="site-header">
<a class="brand" href="#" id="home-link" aria-label="Paper Days home"><span class="brand-icon" aria-hidden="true">P<span></span></span><span>paper days<small>YOUR TIME, YOUR CHOICE</small></span></a>
<div class="header-tools"><button class="text-button" id="tips-button" aria-pressed="true">中文提示 On</button><button class="text-button" id="reset-button">Start again</button></div>
</header>
<main id="app" tabindex="-1"></main>
<footer class="site-footer"><span>A little time. A life of choices.</span><span>Your choices stay in this browser.<span class="cn">你的选择仅保存在此浏览器</span></span></footer>
<div class="toast" role="status" aria-live="polite" id="toast"></div>
<dialog id="reset-dialog"><form method="dialog"><span class="eyebrow">A FRESH STRIP</span><h2>Start a new game?</h2><p>Your current choices will be cleared.<span class="cn">将清除本次选择</span></p><div class="button-row"><button class="button secondary" value="cancel">Keep my game</button><button class="button" id="confirm-reset" value="reset">Start again</button></div></form></dialog>
<script type="module" src="./app.mjs?v=2"></script>
</body>
</html>
