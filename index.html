<title>Paper Days — Your time, your choice</title>

<header class="site-header">
<a class="brand" href="#" id="home-link" aria-label="Paper Days home"><span class="brand-icon" aria-hidden="true">P<span></span></span><span>paper days<small>YOUR TIME, YOUR CHOICE</small></span></a>
<div class="header-tools"><button class="text-button" id="tips-button" aria-pressed="true">中文提示 开</button><button class="text-button sound-button" id="sound-button" aria-pressed="false" aria-label="撕纸音效" title="撕纸音效"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3zM16 9a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/></svg><span>音效关</span></button><button class="text-button" id="reset-button">Start again<span class="cn" lang="zh-CN">重新开始</span></button></div>
